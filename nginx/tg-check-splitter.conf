# Host-level Nginx config for tg-check-splitter (Telegram Mini App + bot API).
# Install:
#   sudo cp nginx/tg-check-splitter.conf /etc/nginx/sites-available/tg-check-splitter
#   sudo ln -sf /etc/nginx/sites-available/tg-check-splitter /etc/nginx/sites-enabled/tg-check-splitter
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: sudo certbot --nginx -d tg-check-splitter.serge-w.tech
# Certbot rewrites THIS file in place with its own certificate (listen 443 +
# redirect block); the :80 server block below is replaced by certbot's redirect.

upstream tg_check_splitter { server 127.0.0.1:8005; }

# WebSocket upgrade plumbing. $connection_upgrade is NOT a builtin — it has to be
# mapped, and nothing else on this host defines it, so without this block
# `nginx -t` fails outright with "unknown connection_upgrade variable" and the
# vhost never loads. Keep it here rather than in nginx.conf so this file stays
# self-contained; sites-* are included in the http context, where `map` is valid.
# If another vhost ever defines the same map, drop this block (duplicate map = error).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name tg-check-splitter.serge-w.tech;

    # Receipt photos: the app caps uploads at 5 MB per photo, but multipart
    # overhead + multiple photos mean 20m is the right ceiling (same as
    # portfolio.conf).
    client_max_body_size 20m;

    # HSTS. `always` is load-bearing: without it nginx only emits the header on
    # 2xx/3xx. Set on the TLS block only — certbot moves this block to 443.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- SPA + API ---
    location / {
        proxy_pass http://tg_check_splitter;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
