# Host-level Nginx config for tg-check-splitter (Telegram Mini App + bot API).
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE IS THE HOST COPY, TLS INCLUDED. Keep it that way.
#
# It once held only the :80 server block, because `certbot --nginx` adds the TLS
# directives directly to the installed file. Copying that partial version over the
# host copy on 2026-08-04 removed `listen 443 ssl` and the certificate paths, so the
# vhost stopped answering on 443 at all: HTTPS requests fell through to the default
# server (obsidian) and were served its certificate. Telegram only opens a Mini App
# over HTTPS, so the app was down until certbot put the blocks back.
#
# Rule: after any `certbot --nginx` run that touches this vhost, sync host → repo.
# Never the other way round with a file that is missing the TLS blocks below.
# ─────────────────────────────────────────────────────────────────────────────
#
# Install:
#   sudo cp nginx/tg-check-splitter.conf /etc/nginx/sites-available/tg-check-splitter.conf
#   sudo ln -sf /etc/nginx/sites-available/tg-check-splitter.conf \
#              /etc/nginx/sites-enabled/tg-check-splitter.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify TLS afterwards — a reload succeeds even when the wrong certificate is served:
#   curl -sI https://tg-check-splitter.serge-w.tech/api/health | head -1
#   echo | openssl s_client -connect tg-check-splitter.serge-w.tech:443 \
#        -servername tg-check-splitter.serge-w.tech 2>/dev/null \
#      | openssl x509 -noout -subject      # must say CN=tg-check-splitter.serge-w.tech
#
# First issue / re-issue: sudo certbot --nginx -d tg-check-splitter.serge-w.tech

upstream tg_check_splitter { server 127.0.0.1:8005; }

# WebSocket upgrade plumbing. $connection_upgrade is not a builtin — it has to be
# mapped somewhere in the http context.
#
# The sibling portfolio.conf already defines an identical map, and since sites-* all
# load into the same http context this vhost worked without a map of its own. It is
# declared here anyway so the file is self-contained: portfolio.conf is rewritten in
# place by `certbot --nginx`, and this vhost should not depend on a WebSocket variable
# surviving in someone else's file.
#
# Two identical map blocks for the same variable are accepted by nginx — verified with
# `nginx -t` on 1.28 — so this does not clash with portfolio.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name tg-check-splitter.serge-w.tech;

    # Receipt photos: the app caps uploads at 5 MB per photo, but multipart
    # overhead + multiple photos mean 20m is the right ceiling (same as
    # portfolio.conf).
    client_max_body_size 20m;

    # HSTS. `always` is load-bearing: without it nginx only emits the header on
    # 2xx/3xx.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- SPA + API ---
    location / {
        proxy_pass http://tg_check_splitter;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Must stay above _OCR_DEADLINE_SECONDS in api/routes/ocr.py (240 s), or nginx
        # cuts the connection before the app can fail and refund the user's scan.
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tg-check-splitter.serge-w.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tg-check-splitter.serge-w.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = tg-check-splitter.serge-w.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name tg-check-splitter.serge-w.tech;
    listen 80;
    return 404; # managed by Certbot
}
